# Git hooks for rigsmith, managed by lefthook (https://lefthook.dev).
# Install (once per clone):  lefthook install
# Skip in a pinch:           git commit/push --no-verify

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        [ -z "$unformatted" ] && exit 0
        echo "gofmt: these files need formatting:" >&2
        echo "$unformatted" >&2
        echo "→ run: gofmt -w ." >&2
        exit 1

pre-push:
  # A script, not a command: lefthook skips a pre-push command when the push
  # carries no new files, and a force push of an older main carries none — the
  # one push this guard exists to stop. Scripts don't have that skip.
  scripts:
    # Guard against clobbering main: refuse a push that would move the
    # remote's main backwards or sideways (the mistake that erases merged PRs).
    # It checks the refs being pushed, so tags and other branches always pass,
    # whatever is checked out. Override with --no-verify.
    "no-clobber-main.sh":
      runner: sh
      use_stdin: true
