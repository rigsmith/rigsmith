# Copy into each dependent member's .github/workflows/ directory.
# Keep a trusted, current manifest (including committed cursor bumps) in this
# repository's default branch. No PR checkout or PR event payload is needed.
name: Refresh stack dependencies
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write # Optional for reporting, required to publish green statuses.
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.10'
      - name: Install pinned rig
        # Replace vX.Y.Z with a released version containing stack deps.
        run: go install github.com/rigsmith/rigsmith/cmd/rig@vX.Y.Z
      - name: Refresh this repository's dependent PR statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # For private sibling upstreams, optionally replace github.token with
          # a secret token able to read them and write this repo's statuses.
        run: rig stack deps --manifest stack/rig.stack.jsonc --publish
