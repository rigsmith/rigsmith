<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>clauderig</title>
<style>
  /* Tokens lifted from design/RigSmith Brand.html — the brand page is the source. */
  :root{
    --ink:#0E0E12; --ink-2:#15151b; --ink-3:#1c1c24;
    --line:#26262f; --line-soft:#1d1d25;
    --paper:#ECECEE; --muted:#7b7b87; --muted-2:#52525c;
    /* health — core/brand Green/Yellow/Red, dark-background values */
    --ok:#4CB86A; --warn:#E4B750; --err:#EF6661;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-weight:400;line-height:1.6;
    -webkit-font-smoothing:antialiased;font-feature-settings:"liga" 0;
    user-select:none;
  }
  /* 38px clears the inset traffic lights, which are drawn over the page with
     the macOS hidden-inset title bar rather than above it. */
  .wrap{padding:38px 32px 40px;}
  .eyebrow{
    font-size:11px;letter-spacing:0.22em;text-transform:uppercase;
    color:var(--muted);font-weight:500;
    display:flex;align-items:center;gap:14px;
    /* Drag the window by its header — the title bar is hidden-inset, so there
       is almost nothing else to grab. The button opts out below. */
    --wails-draggable:drag;
  }
  .eyebrow button{--wails-draggable:no-drag;}
  .eyebrow .rule{flex:1;height:1px;background:var(--line);}
  /* Reaching the sessions window should not require finding the tray icon —
     the tray is the app, but once a window is open the other one is the
     obvious next place to go. */
  .eyebrow button{
    background:var(--ink-3);color:var(--paper);border:1px solid var(--line);
    border-radius:5px;padding:5px 10px;cursor:pointer;
    font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
    text-transform:uppercase;
  }
  .eyebrow button:hover{border-color:var(--muted-2);}
  /* The default ring draws inside the control and gets clipped by its own
     border radius, which reads as a stray highlight across the label. */
  .eyebrow button:focus-visible{outline:1px solid var(--muted);outline-offset:2px;}
  .eyebrow button:focus:not(:focus-visible){outline:none;}
  .seclabel{
    display:flex;align-items:center;gap:14px;
    font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--muted);margin:32px 0 16px;font-weight:500;
  }
  .seclabel .rule{flex:1;height:1px;background:var(--line);}

  /* banner — the health readout */
  .banner{
    display:flex;align-items:flex-start;gap:14px;
    background:var(--ink-2);border:1px solid var(--line);
    border-left-width:3px;border-radius:6px;padding:16px 18px;
  }
  .banner[data-level=green]{border-left-color:var(--ok);}
  .banner[data-level=amber]{border-left-color:var(--warn);}
  .banner[data-level=red]{border-left-color:var(--err);}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:8px;flex:none;}
  .banner[data-level=green] .dot{background:var(--ok);}
  .banner[data-level=amber] .dot{background:var(--warn);}
  .banner[data-level=red]   .dot{background:var(--err);}
  .summary{font-size:15px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;}
  .sub{color:var(--muted);font-size:12px;margin-top:5px;}
  code{
    background:var(--ink-3);border:1px solid var(--line);border-radius:4px;
    padding:1px 6px;font-family:var(--mono);font-size:11px;color:var(--paper);
  }

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{
    text-align:left;font-weight:500;font-size:10px;letter-spacing:0.14em;
    text-transform:uppercase;color:var(--muted-2);
    padding:0 12px 8px 0;border-bottom:1px solid var(--line-soft);
  }
  td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .name{font-weight:700;}
  /* Matches the healthy tray icon: this row is the machine you're looking at.
     Green, not a warm hue — amber/yellow/red are reserved for "needs
     attention", and an identity marker must never compete with them. */
  .this{color:var(--ok);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;}
  .dim{color:var(--muted);}
  .num{font-variant-numeric:tabular-nums;}
  .stale{color:var(--warn);}
  .err{color:var(--err);}

  /* activity feed — failures and refusals are rows in their own right, not
     footnotes; that they were ever buried in hook stderr is why this exists. */
  .ev{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px;}
  .ev:last-child{border-bottom:none;}
  .ev .tick{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted-2);align-self:center;}
  .ev[data-outcome=failed] .tick{background:var(--err);}
  .ev[data-outcome=refused] .tick{background:var(--warn);}
  .ev .body{flex:1;min-width:0;}
  .ev .text{overflow-wrap:anywhere;}
  .ev[data-outcome=failed] .text{color:var(--err);}
  .ev[data-outcome=refused] .text{color:var(--warn);}
  .ev .meta{color:var(--muted-2);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;margin-top:3px;}
  .ev .leak{color:var(--warn);font-size:11px;margin-top:4px;overflow-wrap:anywhere;}
  .ev .when{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .empty{color:var(--muted-2);font-size:12px;padding:6px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">
    <span id="machine">—</span>
    <span class="rule"></span>
    <button id="openSessions" title="Browse every Claude Code session this machine can see">Sessions</button>
  </div>

  <div class="seclabel"><span>Sync</span><span class="rule"></span></div>
  <div class="banner" id="banner" data-level="amber">
    <div class="dot"></div>
    <div>
      <div class="summary" id="summary">Checking…</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <div class="seclabel"><span>Devices</span><span class="rule"></span></div>
  <table><thead><tr><th>Machine</th><th>OS</th><th>Claude</th><th>Last sync</th></tr></thead>
    <tbody id="devices"></tbody></table>

  <div class="seclabel"><span>Roots</span><span class="rule"></span></div>
  <table><thead><tr><th>Root</th><th>Files</th><th>State</th></tr></thead>
    <tbody id="roots"></tbody></table>

  <div class="seclabel"><span>Activity</span><span class="rule"></span></div>
  <div id="activity"></div>
</div>

<script type="module">
import { Call, Events } from '/wails/runtime.js';

const $ = id => document.getElementById(id);

// Wails keys bound methods by "<go import path>.<type>.<method>". Spelled out
// because we call the runtime directly rather than running `wails3 generate
// bindings` — that would add a Node step to a Go-only CI. Keep in sync with
// ui/bridge; ui/bridge/binding_test.go fails if this drifts.
const STATUS_GET = 'github.com/rigsmith/rigsmith/ui/bridge.Status.Get';
const ACTIVITY_RECENT = 'github.com/rigsmith/rigsmith/ui/bridge.Activity.Recent';
const WINDOWS_OPEN = 'github.com/rigsmith/rigsmith/ui/bridge.Windows.Open';

// Coarse relative time, matching how `clauderig status` phrases it.
function since(iso) {
  if (!iso || iso.startsWith('0001-01-01')) return 'never';
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.floor(mins / 60)}h ago`;
  return `${Math.floor(mins / 1440)}d ago`;
}

// A machine silent for over a day is worth flagging — that is how long the
// 2026-08-07 divergence went unnoticed.
const STALE_MINUTES = 24 * 60;
const isStale = iso => iso && (Date.now() - new Date(iso)) / 60000 > STALE_MINUTES;

const cell = (text, cls) => {
  const td = document.createElement('td');
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
};

function render(snap) {
  $('machine').textContent = `${snap.machine} · ${snap.os}`;

  $('banner').dataset.level = snap.level;
  $('summary').textContent = snap.summary;

  const sub = $('sub');
  sub.replaceChildren();
  if (snap.action) {
    sub.append('Run ');
    const c = document.createElement('code');
    c.textContent = snap.action;
    sub.append(c);
    sub.append(snap.lastSync ? ' · ' : '');
  }
  if (snap.lastSync) sub.append(`last sync ${snap.lastSync}`);

  const devices = $('devices');
  devices.replaceChildren();
  for (const d of snap.devices ?? []) {
    const tr = document.createElement('tr');
    const name = cell(d.name, 'name');
    if (d.this) {
      const tag = document.createElement('span');
      tag.className = 'this';
      tag.textContent = ' this';
      name.append(tag);
    }
    tr.append(
      name,
      cell(d.os, 'dim'),
      cell(d.claudeVersion || '—', 'dim'),
      cell(since(d.lastSync), isStale(d.lastSync) ? 'stale num' : 'dim num'),
    );
    devices.append(tr);
  }

  const roots = $('roots');
  roots.replaceChildren();
  for (const r of snap.roots ?? []) {
    const tr = document.createElement('tr');
    tr.append(
      cell(r.id, 'name'),
      cell(r.present ? r.files.toLocaleString() : '—', 'num dim'),
      cell(r.present ? 'present' : 'absent here', 'dim'),
    );
    roots.append(tr);
  }
}

function renderActivity(events) {
  const box = $('activity');
  box.replaceChildren();

  if (!events?.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'Nothing recorded yet — the next sync will show up here.';
    box.append(p);
    return;
  }

  for (const ev of events) {
    const row = document.createElement('div');
    row.className = 'ev';
    row.dataset.outcome = ev.outcome;

    const tick = document.createElement('div');
    tick.className = 'tick';

    const body = document.createElement('div');
    body.className = 'body';

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = ev.summary;
    body.append(text);

    // A refusal names what it caught. "Refused" alone reads as a malfunction;
    // the paths are what make it read as a save.
    for (const leak of ev.leaks ?? []) {
      const l = document.createElement('div');
      l.className = 'leak';
      l.textContent = leak;
      body.append(l);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = ev.this ? ev.op : `${ev.op} · ${ev.machine}`;
    body.append(meta);

    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = since(ev.at);

    row.append(tick, body, when);
    box.append(row);
  }
}

async function refresh() {
  try {
    render(await Call.ByName(STATUS_GET));
  } catch (e) {
    $('banner').dataset.level = 'red';
    $('summary').textContent = 'Could not read sync status';
    $('sub').textContent = String(e);
  }
  // Independent of the status call: a broken journal must not blank the
  // status panel, and vice versa.
  try {
    renderActivity(await Call.ByName(ACTIVITY_RECENT, 50));
  } catch (e) {
    const box = $('activity');
    box.replaceChildren();
    const p = document.createElement('div');
    p.className = 'empty err';
    p.textContent = `Could not read the journal: ${e}`;
    box.append(p);
  }
}

$('openSessions').addEventListener('click', async () => {
  try {
    await Call.ByName(WINDOWS_OPEN, 'sessions');
  } catch (e) {
    // A window that will not open is worth saying out loud; the button
    // otherwise looks simply dead.
    $('sub').textContent = `Could not open the sessions window: ${e}`;
  }
});

// The tray polls anyway; re-read the full snapshot whenever it does, so an open
// window never drifts from the icon.
Events.On('clauderig:health', refresh);
refresh();
</script>
</body>
</html>
