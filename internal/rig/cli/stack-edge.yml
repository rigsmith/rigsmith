name: Publish edge packages
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stack-edge-lib
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned rig
        # Replace vX.Y.Z with a reviewed release containing edge ci.
        env:
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
        run: go install github.com/rigsmith/rigsmith/cmd/rig@vX.Y.Z
      # Public seed and members: this build job receives no credentials.
      # Choose the member and build/test commands for your stackspace.
      - name: Build and report edge packages
        id: report
        env:
          EDGE_NUMBER: ${{ github.run_number }}
        run: |
          rig stack edge ci --seed acme/rigstack-app@main --member lib --number "$EDGE_NUMBER" --build 'rig build' --test 'rig test' --report edge.json -o edge-out
          echo "status=$(jq -r '.status' edge.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-packages
          path: |
            edge.json
            edge-out/*.nupkg
          if-no-files-found: error
  publish:
    needs: build
    # Inconclusive tip merges upload a report but skip publication.
    if: ${{ needs.build.result == 'success' && needs.build.outputs.status == 'packed' }}
    runs-on: ubuntu-latest
    # Create edge-publish with a deployment-branch rule limited to the default
    # branch. Store the key as an environment secret, not a repository secret;
    # remove any repository copy so dispatches on other branches cannot read it.
    environment: edge-publish
    permissions:
      contents: read
    steps:
      # Fresh hosted runner: no checkout, .NET, project code or restored cache.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned rig
        # Install independently; never execute a build-job binary.
        env:
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
        run: go install github.com/rigsmith/rigsmith/cmd/rig@vX.Y.Z
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-packages
          path: report
      # Match the environment variable name to edge.lib.pushKeySecret in the seed.
      # Tip publishing is off: to opt in, add --upstream-tip to the build
      # command AND --allow-tip-publish to the publish command after review.
      - name: Verify and publish edge packages
        env:
          EDGE_FEED_KEY: ${{ secrets.EDGE_FEED_KEY }}
          EDGE_NUMBER: ${{ github.run_number }}
        run: rig stack edge ci --seed acme/rigstack-app@main --member lib --number "$EDGE_NUMBER" --publish report/edge.json -o report/edge-out
