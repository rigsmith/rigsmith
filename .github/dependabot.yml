# Actions are pinned by commit SHA (zizmor's unpinned-uses rule); Dependabot
# moves the SHA and its version comment together when an action releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # gh-aw's lock files are generated from .github/aw/actions-lock.json by
      # `gh aw compile`; bump them with `gh aw update`, not by editing the
      # output, which the next compile would revert.
      - dependency-name: github/gh-aw-actions/*
    groups:
      github-actions:
        patterns: ["*"]
