name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mac:
        description: 'Include the macOS leg (PAUSED by default — it bills at 10x)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is PAUSED (2026-08-20). It bills at 10x the linux rate and this repo pushes
        # often — 188 runs in the week to 08-20, 47 on that day alone, each carrying a mac leg.
        # ubuntu + windows still cover the path/exec differences that matter most for a Go CLI.
        # To get the mac leg back for one run:
        #   gh workflow run ci.yml --ref <branch> -f mac=true
        # To unpause permanently, put macos-latest back in the second array.
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.mac) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The parity/cmdtest harnesses create real git repos; give git an identity
      # and quiet the default-branch hint on every runner.
      - name: Configure git for tests
        run: |
          git config --global user.email ci@rigsmith.test
          git config --global user.name rigsmith-ci
          git config --global init.defaultBranch main

      - name: Test
        run: go test ./... -count=1

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Full history so the scan covers every commit, not just the tip.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --no-banner -v -c .gitleaks.toml

  lint:
    name: vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
