name: CI

on:
  push:
    branches: [main, codex/v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.group == 'all' && format('test ({0})', matrix.os) || format('test ({0}, {1})', matrix.os, matrix.group) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [all]
        # Windows groups previously took 37 minutes in sequence. Keep their
        # commands below shared with Unix, but run each on its own runner.
        include:
          - os: windows-latest
            group: other
          - os: windows-latest
            group: completion
          - os: windows-latest
            group: staging
          - os: windows-latest
            group: artifacts
          - os: windows-latest
            group: service
          - os: windows-latest
            group: publication
          - os: windows-latest
            group: queue
          - os: windows-latest
            group: compatibility
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # pinned pre-refactor source for command compatibility

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Wails v3 links against GTK 4 and WebKitGTK 6.0 on Linux — not the GTK 3 /
      # WebKit2GTK 4.1 pairing most guides still name — so `go test ./...` cannot
      # compile ./ui here without them. The app only ships for macOS, but keeping
      # it inside ./... means a change that breaks another platform is caught
      # here rather than by whoever tries to port it.
      - name: Linux GUI headers (for ./ui)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Chrome is preinstalled and unused here. Its unrelated package index
          # can be inconsistent during publication and block Ubuntu GUI headers.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # The parity/cmdtest harnesses create real git repos; give git an identity
      # and quiet the default-branch hint on every runner.
      - name: Configure git for tests
        run: |
          git config --global user.email ci@rigsmith.test
          git config --global user.name rigsmith-ci
          git config --global init.defaultBranch main

      # Retained-publication fixtures exercise the actual configured gh helper.
      - name: GitHub CLI for synthetic authentication fixtures
        run: gh --version

      # Git-heavy fixtures exceed Go's cumulative per-package timeout on Windows.
      # Keep the ten-minute limit, with exhaustive, disjoint groups and separate
      # progress/timing for shared artifacts, merge completion/staging and services.
      - name: Test other packages
        if: matrix.group == 'all' || matrix.group == 'other'
        shell: bash
        env:
          CLAUDERIG_E2E: '1' # synthetic fixtures only; real-data scan has its own gate
        run: |
          go list ./... | grep -Ev '^github.com/rigsmith/rigsmith/internal/(clauderig/service|agentrig/commitartifact)$' | xargs go test -count=1

      - name: Test merge completion and long paths
        if: matrix.group == 'all' || matrix.group == 'completion'
        run: go test ./internal/agentrig/commitartifact -count=1 -timeout=10m -run '^TestMergeStage(Complete|Intent|Long|Windows)'

      - name: Test recoverable merge staging
        if: matrix.group == 'all' || matrix.group == 'staging'
        run: go test ./internal/agentrig/commitartifact -count=1 -timeout=10m -run '^TestMergeStage' -skip '^TestMergeStage(Complete|Intent|Long|Windows)'

      - name: Test shared commit artifacts
        if: matrix.group == 'all' || matrix.group == 'artifacts'
        run: go test ./internal/agentrig/commitartifact -count=1 -timeout=10m -skip '^TestMergeStage'

      - name: Test Claude service workflows
        if: matrix.group == 'all' || matrix.group == 'service'
        env:
          CLAUDERIG_E2E: '1'
        run: go test ./internal/clauderig/service -count=1 -timeout=10m -skip '^Test(PublishArtifact|QueueAdapter)'

      - name: Test retained publication
        if: matrix.group == 'all' || matrix.group == 'publication'
        env:
          CLAUDERIG_E2E: '1'
        run: go test ./internal/clauderig/service -count=1 -timeout=10m -run '^TestPublishArtifact'

      - name: Test queue execution
        if: matrix.group == 'all' || matrix.group == 'queue'
        env:
          CLAUDERIG_E2E: '1'
        run: go test ./internal/clauderig/service -count=1 -timeout=10m -run '^TestQueueAdapter'

      - name: ClaudeRig baseline compatibility
        if: matrix.group == 'all' || matrix.group == 'compatibility'
        env:
          CLAUDERIG_COMPAT: '1'
        run: go test ./internal/clauderig/compatibility -count=1 -v -timeout=10m

  test-result:
    # Preserve the existing required check name. The shared matrix contains all
    # Windows groups plus Unix, so this gate conservatively requires all of them.
    name: test (windows-latest)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test group to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Full history of the tested revision, not just its tip. The checkout also
      # fetches other branches; those must not change this revision's verdict.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan tested revision history
        run: gitleaks git --no-banner -v -c .gitleaks.toml --log-opts=HEAD

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # go-version-file honours the go directive, so the scan runs on the same
      # toolchain the module requires — which is the point: most findings here
      # have been standard-library ones, invisible to any dependency bump.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Pinned rather than @latest so a tool release cannot change the verdict
      # on an unrelated PR; the vulnerability database is fetched live, so this
      # still scans against current advisories.
      - name: Install govulncheck
        env:
          GOVULNCHECK_VERSION: v1.1.4
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Scan
        run: govulncheck ./...

  lint:
    name: vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
