name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The Wails UI links against GTK and WebKit on Linux, so `go test ./...`
      # cannot even compile ./ui there without the headers. The app itself only
      # ships for macOS, but keeping it inside ./... means a change that breaks
      # the build on another platform is caught here rather than by whoever
      # tries to port it.
      - name: Linux GUI headers (for ./ui)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The parity/cmdtest harnesses create real git repos; give git an identity
      # and quiet the default-branch hint on every runner.
      - name: Configure git for tests
        run: |
          git config --global user.email ci@rigsmith.test
          git config --global user.name rigsmith-ci
          git config --global init.defaultBranch main

      - name: Test
        run: go test ./... -count=1

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Full history so the scan covers every commit, not just the tip.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --no-banner -v -c .gitleaks.toml

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # go-version-file honours the go directive, so the scan runs on the same
      # toolchain the module requires — which is the point: most findings here
      # have been standard-library ones, invisible to any dependency bump.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Pinned rather than @latest so a tool release cannot change the verdict
      # on an unrelated PR; the vulnerability database is fetched live, so this
      # still scans against current advisories.
      - name: Install govulncheck
        env:
          GOVULNCHECK_VERSION: v1.1.4
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Scan
        run: govulncheck ./...

  lint:
    name: vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
