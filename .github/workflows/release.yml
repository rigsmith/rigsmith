name: Release

# Releases rigsmith with rigsmith/shiprig-action (changesets/action driving
# shiprig), acting as the shipRig GitHub App. On every push to main:
#
#   - Changesets pending: keep a standing release PR open with the version
#     bumps and changelog, titled and committed as what it releases
#     ("chore: release 1.20.2", the action's default). Nothing is tagged.
#   - The push that merges the release PR: `shiprig tag` tags each package it
#     releases whose version has no tag yet (ignored packages never, private
#     ones only with privatePackages.tag) — vX.Y.Z for the CLIs, ui/vX.Y.Z for
#     the UI — and the action pushes those tags, failing the run if one can't
#     be pushed. The tag push starts goreleaser.yml or release-ui.yml, which
#     build, sign and publish exactly as they do for a tag pushed by hand.
#   - Any other push with nothing pending: nothing happens (the action's
#     publish-on: version-pr-merge default).
#
# To recover, re-run the failed run itself (Actions → the run → Re-run jobs):
# a re-run uses that run's own commit, so the tags land on the release commit
# even if main has moved on. There is deliberately no manual trigger: it would
# tag main's latest commit, which after any later push isn't the release. If the
# tags are on GitHub but goreleaser.yml or release-ui.yml failed, re-run that
# run instead.
#
# The App token is what makes that hand-off work: a tag pushed with GITHUB_TOKEN
# does not start other workflows. It also means the release PR's CI runs
# without "Approve workflows to run". GitHub Releases stay GoReleaser's, so the
# action's own are off.
#
# Needs the shipRig App installed on this repository, with its client ID in the
# org variable SHIPRIG_APP_CLIENT_ID and its private key in the org secret
# SHIPRIG_APP_PRIVATE_KEY.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One at a time, never cancelled, and every push gets its run. A running job
# can't be cancelled (it could leave the PR branch half-updated, or tag without
# pushing), and a waiting one can't be replaced: by default a newer push drops
# the pending run, and if that run was the release PR's merge, its versions
# would never be tagged. `queue: max` keeps up to 100 waiting, first in first
# out; each run checks out its own commit, so a merge run still tags that
# commit.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Get a shipRig App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SHIPRIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHIPRIG_APP_PRIVATE_KEY }}
          permission-contents: write # the release PR branch and the tags
          permission-pull-requests: write # open and update the release PR

      # Full history and every tag, so `shiprig tag` sees what's already
      # released. No stored credentials: the action writes through the GitHub
      # API with the App token and never pushes with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The released shiprig, pinned, not the one in this tree: a broken main
      # must not be able to write the release PR or cut a release.
      - name: Install shiprig
        run: .github/actions/release/install-shiprig.sh
        env:
          INPUT_SHIPRIG_VERSION: v1.20.2
          GITHUB_TOKEN: ${{ github.token }}

      - name: Release PR or tags
        id: shiprig
        uses: rigsmith/shiprig-action@ec23d482a2e2e10872edc876a223c0f07d767dc8 # v0.3.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: shiprig tag
          create-github-releases: false
