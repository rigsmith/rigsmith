name: Version PR

# Keeps a standing "chore: release" PR open while changesets are pending, using
# rigsmith/shiprig-action (changesets/action driving shiprig). This is stage 1
# of dogfooding it: the action ONLY writes that PR. It never tags, publishes or
# creates a GitHub release — there is no publish-script, so on a push with
# nothing pending it logs "Not publishing" and stops.
#
# Releasing is unchanged: merge the PR, then push the vX.Y.Z tag by hand, and
# goreleaser.yml does the rest. Stage 2 (the action pushing the tag) needs a
# GitHub App token, because a tag pushed with GITHUB_TOKEN does not trigger
# other workflows; see shiprig-action's docs/ROADMAP.md.
#
# The PR is opened with GITHUB_TOKEN, so its CI runs wait for "Approve
# workflows to run", and the repository must allow GitHub Actions to create
# pull requests (Settings → Actions → General → Workflow permissions).

on:
  push:
    branches: [main]

permissions:
  contents: read

# One at a time, and never cancelled: a cancelled run could leave the PR
# branch half-updated.
concurrency:
  group: version-pr
  cancel-in-progress: false

jobs:
  version-pr:
    name: Version PR
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open and update the PR
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The released shiprig, pinned, not the one in this tree: a broken main
      # must not be able to write the release PR.
      - name: Install shiprig
        run: .github/actions/release/install-shiprig.sh
        env:
          INPUT_SHIPRIG_VERSION: v1.20.0
          GITHUB_TOKEN: ${{ github.token }}

      - uses: rigsmith/shiprig-action@v0.1.0
        with:
          commit-message: "chore: release"
          pr-title: "chore: release"
